<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual PDF preview · {{ title }}</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #183047; background: #edf2f6; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #d6e0e8; background: rgba(255,255,255,.97); box-shadow: 0 3px 12px rgba(27,51,72,.08); }
    h1 { margin: 0; overflow: hidden; color: #173c61; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; flex: 0 0 auto; gap: 8px; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 34px; padding: 7px 11px; border: 1px solid #d4e0e8; border-radius: 7px; color: #2b5e7c; background: #fff; font-size: 11px; font-weight: 750; text-decoration: none; }
    a.primary { border-color: #173c61; color: #fff; background: #173c61; }
    main { width: min(100%, 1080px); margin: 18px auto 30px; padding: 0 14px; }
    .page { margin: 0 auto 18px; padding: 12px; border: 1px solid #d7e0e8; border-radius: 8px; background: #fff; box-shadow: 0 4px 18px rgba(27,51,72,.10); }
    .page-label { margin: 0 0 8px; color: #718196; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    img { display: block; width: 100%; height: auto; background: #fff; }
    @media (max-width: 560px) { header { align-items: flex-start; flex-direction: column; } main { padding: 0 7px; } .page { padding: 6px; } }
  </style>
</head>
<body>
  <header>
    <h1>{{ title }} · {{ pages|length }}-page visual preview</h1>
    <nav class="actions" aria-label="Preview actions">
      <a href="{{ back_url }}">Back</a>
      <a class="primary" href="{{ download_url }}">Download PDF</a>
    </nav>
  </header>
  <main>
    {% for page in pages %}
      <section class="page">
        <p class="page-label">Page {{ page['number'] }} of {{ pages|length }}</p>
        <img src="{{ page['data_uri'] }}" alt="Rendered page {{ page['number'] }} of {{ title }}" loading="lazy">
      </section>
    {% endfor %}
  </main>
</body>
</html>
